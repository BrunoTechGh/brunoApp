name: Build, Push, and Update Manifest

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'k8s/**' # Prevents infinite loop when Actions commits manifest updates

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows workflow to commit updated image tag back to repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/brunoapp:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/brunoapp:latest

      - name: Update Kubernetes Deployment image tag
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/brunoapp:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: update image tag to ${{ github.sha }}"
          git pull --rebase origin main
          git push
