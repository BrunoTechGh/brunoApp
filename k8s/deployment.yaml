apiVersion: apps/v1
kind: Deployment
metadata:
  name: bruno-app
  labels:
    app: bruno-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bruno-app
  template:
    metadata:
      labels:
        app: bruno-app
    spec:
      containers:
        - name: bruno-app
          image: bruno6725/brunoapp:5647c528f24d4fdcd1531c587edd5451f82e6968
          ports:
            - containerPort: 8080