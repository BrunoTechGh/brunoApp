apiVersion: apps/v1
kind: Deployment
metadata:
  name: bruno-app
  labels:
    app: bruno-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bruno-app
  template:
    metadata:
      labels:
        app: bruno-app
    spec:
      containers:
        - name: bruno-app
          image: bruno6725/brunoapp:61e278c1d970ebf3c32edf124a54eb77f4782a2a
          ports:
            - containerPort: 8080