apiVersion: apps/v1
kind: Deployment
metadata:
  name: bruno-app
  labels:
    app: bruno-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bruno-app
  template:
    metadata:
      labels:
        app: bruno-app
    spec:
      containers:
        - name: bruno-app
          image: bruno6725/brunoapp:936b3860b11f792a9463a0021ca8eef2eb546158
          ports:
            - containerPort: 8080
